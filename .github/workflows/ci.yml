name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application
        run: python -m compileall -q app migrations tests
      - name: Run database migrations
        env:
          APP_ENV: testing
        run: python -m flask --app main db upgrade
      - name: Verify migration graph
        env:
          APP_ENV: testing
        run: python -m flask --app main db heads
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
