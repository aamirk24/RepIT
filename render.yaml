services:
  - type: web
    name: repit
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m flask --app main prepare-deploy && gunicorn -c gunicorn.conf.py main:app
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: PROXY_FIX_HOPS
        value: 1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
